services:
  # ───────────────────────── API + WebSocket (ASGI / Daphne) ─────────────────
  # IMPORTANT : le nom du service détermine l'URL publique.
  #   name: new-babifixbuild  →  https://new-babifixbuild.onrender.com
  # Cette URL DOIT correspondre à `kBabifixProdUrl` dans
  # babifix_client_flutter/lib/babifix_api_config.dart (et l'app prestataire).
  - type: web
    name: new-babifixbuild
    env: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # RENDER_EXTERNAL_HOSTNAME est ajouté automatiquement aux ALLOWED_HOSTS
      # par settings.py — on garde aussi une valeur explicite par sécurité.
      - key: DJANGO_ALLOWED_HOSTS
        value: new-babifixbuild.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://new-babifixbuild.onrender.com
      # ── Base de données Postgres (Render) ──
      - key: DATABASE_URL
        fromDatabase:
          name: babifix-db
          property: connectionString
      # ── Channels temps réel (WebSocket) ──
      - key: REDIS_URL
        fromService:
          name: babifix-redis
          type: redis
          property: connectionString
      # ── Paiement GeniusPay (secrets à saisir dans le dashboard Render) ──
      - key: GENIUSPAY_PUBLIC_KEY
        sync: false
      - key: GENIUSPAY_SECRET_KEY
        sync: false
      - key: GENIUSPAY_WEBHOOK_URL
        value: https://new-babifixbuild.onrender.com/api/paiements/geniuspay/webhook/
      - key: CORS_ALLOWED_ORIGINS
        value: https://new-babifixbuild.onrender.com
      # ── E-mail (expéditeur affiché « BABIFIX ») ──
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: kouayavana20@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: BABIFIX <kouayavana20@gmail.com>
      # ── Push FCM (optionnel) : chemin du JSON de compte de service Firebase
      #    Uploade le fichier comme "Secret File" sur Render et mets son chemin.
      - key: FIREBASE_CREDENTIALS_JSON_PATH
        sync: false
      # ── Création automatique du superadmin au 1er déploiement ──
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # ───────────────────────── Redis (Channels / temps réel) ───────────────────
  - type: redis
    name: babifix-redis
    region: frankfurt
    plan: free
    ipAllowList: []   # accès interne uniquement (autres services Render)

databases:
  - name: babifix-db
    plan: free
    region: frankfurt

{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès refusé — BABIFIX</title>
  <link rel="icon" type="image/png" href="{% static 'adminpanel/logo_babifix.png' %}">
  <link rel="shortcut icon" type="image/png" href="{% static 'adminpanel/logo_babifix.png' %}">
  <link rel="apple-touch-icon" href="{% static 'adminpanel/logo_babifix.png' %}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0B1B34 0%, #7C3D00 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 80%, rgba(232, 119, 34, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(239, 68, 68, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .card {
      position: relative;
      text-align: center;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      backdrop-filter: blur(16px);
      animation: cardIn 0.5s ease-out;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .shield-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .code { font-size: 80px; font-weight: 900; color: #E87722; line-height: 1; letter-spacing: -3px; }
    .logo { font-size: 22px; font-weight: 800; color: #4CC9F0; margin: 16px 0 8px; }
    h1 { font-size: 22px; font-weight: 700; margin: 8px 0 12px; color: #fff; }
    p { font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.6; margin-bottom: 32px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #4CC9F0 0%, #0B1B34 100%);
      color: #0B1B34;
      font-weight: 800;
      font-size: 14px;
      padding: 12px 22px;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(76, 201, 240, 0.3);
    }
    a.btn.outline {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff;
      box-shadow: none;
    }
    a.btn:hover { transform: translateY(-2px); opacity: .9; }
    a.btn.outline:hover { border-color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E87722" stroke-width="1.5">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M12 8v4M12 16h.01" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="code">403</div>
    <div class="logo">● BABIFIX</div>
    <h1>Accès refusé</h1>
    <p>Vous n'avez pas l'autorisation d'accéder à cette ressource.<br>
       Vérifiez vos identifiants ou contactez le support.</p>
    <div class="actions">
      <a href="/" class="btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Retour à l'accueil
      </a>
      <a href="mailto:contact@babifix.ci" class="btn outline">Contacter le support</a>
    </div>
  </div>
</body>
</html>

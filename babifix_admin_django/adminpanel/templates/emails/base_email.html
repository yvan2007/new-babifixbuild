<!-- Template Email Premium BABIFIX -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BABIFIX{% endblock %}</title>
    <style>
        /* Palettes du projet */
        :root {
            --navy-deep: #0B1B34;
            --navy: #14213D;
            --cyan: #4CC9F0;
            --cyan-light: #06B6D4;
            --text: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255,255,255,0.1);
        }
        body { margin: 0; padding: 0; background-color: var(--navy-deep); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; background: var(--navy); border-radius: 16px; overflow: hidden; }
        .header { background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 100%); padding: 40px 30px; text-align: center; border-bottom: 1px solid var(--border); }
        .logo { width: 56px; height: 56px; background: var(--cyan); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 28px; color: var(--navy-deep); box-shadow: 0 8px 32px rgba(76, 201, 240, 0.25); }
        h1 { color: var(--text); font-size: 24px; font-weight: 800; margin-top: 16px; letter-spacing: -0.5px; }
        .body { padding: 30px; }
        p { color: var(--text-muted); line-height: 1.7; font-size: 15px; margin: 0 0 16px 0; }
        .highlight { color: var(--text); font-weight: 600; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 20px 0; }
        .card p { margin: 0; }
        .btn { display: inline-block; background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%); color: var(--navy-deep) !important; font-weight: 700; padding: 14px 32px; border-radius: 10px; text-decoration: none; font-size: 15px; box-shadow: 0 4px 20px rgba(76, 201, 240, 0.35); margin-top: 10px; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); box-shadow: none; }
        .footer { text-align: center; padding: 20px; font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--border); background: rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">B</div>
            <h1>{% block header_title %}BABIFIX{% endblock %}</h1>
        </div>
        <div class="body">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            &copy; 2026 BABIFIX. Plateforme de Services.<br>
            <span style="color:var(--cyan-light)">Confiance & Excellence</span>
        </div>
    </div>
</body>
</html>

name: Keep Render awake

# Empêche le serveur Render (plan gratuit) de s'endormir après 15 min
# d'inactivité. Sans ça, le 1er appel (login, données…) attend le réveil du
# serveur (30–50 s) et l'app paraît « bloquée / qui tourne ».
# Ce job ping /api/health régulièrement pour garder le serveur réveillé.

on:
  schedule:
    # Toutes les 10 minutes (GitHub peut décaler un peu, c'est suffisant).
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # permet aussi un déclenchement manuel

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint (réveille le serveur si endormi)
        run: |
          # NOTE : slash final OBLIGATOIRE. Sans lui, Django (APPEND_SLASH)
          # renvoie un 301 vers /api/health/ — jamais un 200 — et l'ancien test
          # « = 200 » échouait donc systématiquement à tort.
          URL="https://new-babifixbuild.onrender.com/api/health/"
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Tentative $i : HTTP $code"
            # Toute réponse HTTP prouve que le serveur est debout (même un 4xx).
            if [ "$code" != "000" ]; then
              echo "Serveur réveillé ✅ (HTTP $code)"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Le serveur n'a répondu à aucune des 4 tentatives."
          # On ne fait pas échouer le job (keep-alive best-effort, pas un moniteur).
          exit 0

name: Build iOS IPA (Sans Mac)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'babifix_client_flutter/**'
      - 'babifix_prestataire_flutter/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build_ios_client:
    name: Build iOS IPA · Client
    runs-on: macos-latest
    defaults:
      run:
        working-directory: babifix_client_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Flutter iOS Config
        run: |
          flutter build ios --config-only --release \
            --dart-define=BABIFIX_ENV=production \
            --dart-define=BABIFIX_API_BASE=https://new-babifixbuild.onrender.com

      - name: Compile Unsigned iOS Binary with Xcode
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Packaging IPA (Payload structure)
        run: |
          mkdir -p Payload
          cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r -y BABIFIX-Client.ipa Payload

      - name: Upload Client IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BABIFIX-Client-iOS-IPA
          path: babifix_client_flutter/BABIFIX-Client.ipa
          retention-days: 14

  build_ios_prestataire:
    name: Build iOS IPA · Prestataire
    runs-on: macos-latest
    defaults:
      run:
        working-directory: babifix_prestataire_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Flutter iOS Config
        run: |
          flutter build ios --config-only --release \
            --dart-define=BABIFIX_ENV=production \
            --dart-define=BABIFIX_API_BASE=https://new-babifixbuild.onrender.com

      - name: Compile Unsigned iOS Binary with Xcode
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Packaging IPA (Payload structure)
        run: |
          mkdir -p Payload
          cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r -y BABIFIX-Prestataire.ipa Payload

      - name: Upload Prestataire IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BABIFIX-Prestataire-iOS-IPA
          path: babifix_prestataire_flutter/BABIFIX-Prestataire.ipa
          retention-days: 14

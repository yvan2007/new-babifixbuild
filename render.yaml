services:
  # ───────────────────────── API + WebSocket (ASGI / Daphne) ─────────────────
  # Le nom du service détermine l'URL publique :
  #   name: new-babifixbuild  →  https://new-babifixbuild.onrender.com
  # Cette URL DOIT correspondre à `kBabifixProdUrl` dans les apps Flutter.
  - type: web
    name: new-babifixbuild
    runtime: python
    region: frankfurt
    plan: free
    rootDir: babifix_admin_django          # le projet Django est dans ce sous-dossier
    buildCommand: "bash build.sh"
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: new-babifixbuild.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://new-babifixbuild.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: babifix-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: babifix-redis
          type: redis
          property: connectionString
      - key: GENIUSPAY_PUBLIC_KEY
        sync: false
      - key: GENIUSPAY_SECRET_KEY
        sync: false
      - key: GENIUSPAY_WEBHOOK_URL
        value: https://new-babifixbuild.onrender.com/api/paiements/geniuspay/webhook/
      # Mode test : auto-valide les paiements sans confirmation USSD réelle.
      # Passer à "false" pour le vrai flux Mobile Money en production.
      - key: GENIUSPAY_SIMULATE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://new-babifixbuild.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: kouayavana20@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: BABIFIX <kouayavana20@gmail.com>
      - key: FIREBASE_CREDENTIALS_JSON_PATH
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # ───────────────────────── Redis (Channels / temps réel) ───────────────────
  - type: redis
    name: babifix-redis
    region: frankfurt
    plan: free
    ipAllowList: []

databases:
  - name: babifix-db
    plan: free
    region: frankfurt
